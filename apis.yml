aid: firstjobme
name: Firstjob.me
description: >-
  FirstJob (firstjob.me) is a Latin American employment platform founded in Chile in 2012 to
  improve working conditions for young professionals by connecting students and early-career
  candidates (0-2 years of experience) with entry-level jobs and internships at large employers.
  The platform lists 1,200+ active opportunities across engineering, administration, operations,
  and technology, maintains an employer directory, and runs networking events and webinars. It
  also operates related initiatives including Employers For Youth (EFY) and Best Internship
  Experiences (BIE) employer-ranking programs. FirstJob is a consumer-facing web platform used by
  more than 500,000 young professionals; it does not currently publish a public developer API,
  OpenAPI/Swagger specification, SDKs, or a developer portal. It was surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network.
